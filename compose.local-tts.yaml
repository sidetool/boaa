services:
  api:
    environment:
      TTS_PROVIDER_DEFAULT: ${LOCAL_TTS_PROVIDER_DEFAULT:-local-endpoint}
      TTS_PROVIDER_ENABLED: ${LOCAL_TTS_PROVIDER_ENABLED:-local-endpoint}
      TTS_LOCAL_ENDPOINT_MODEL_ID: ${TTS_LOCAL_ENDPOINT_MODEL_ID:-supertonic-3-ko}
      TTS_LOCAL_ENDPOINT_URL: http://tts-model:9010/synthesize
      TTS_LOCAL_ENDPOINT_VOICE_ID: ${TTS_LOCAL_ENDPOINT_VOICE_ID:-M1}
      LOCAL_TTS_ALLOWED_HOSTS: tts-model
      TTS_LOCAL_ENDPOINT_MAX_INPUT_CHARACTERS: 1000

  worker:
    environment:
      TTS_PROVIDER_DEFAULT: ${LOCAL_TTS_PROVIDER_DEFAULT:-local-endpoint}
      TTS_PROVIDER_ENABLED: ${LOCAL_TTS_PROVIDER_ENABLED:-local-endpoint}
      TTS_LOCAL_ENDPOINT_MODEL_ID: ${TTS_LOCAL_ENDPOINT_MODEL_ID:-supertonic-3-ko}
      TTS_LOCAL_ENDPOINT_URL: http://tts-model:9010/synthesize
      TTS_LOCAL_ENDPOINT_VOICE_ID: ${TTS_LOCAL_ENDPOINT_VOICE_ID:-M1}
      LOCAL_TTS_ALLOWED_HOSTS: tts-model
      TTS_LOCAL_ENDPOINT_MAX_INPUT_CHARACTERS: 1000

  tts-model:
    build:
      context: .
      dockerfile: deploy/plain-tts.Dockerfile
    environment:
      MODEL_AUTO_INSTALL: 'true'
    volumes:
      - local-tts-models:/models
    expose:
      - '9010'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9010/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 10m
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    cpus: 4
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    mem_limit: ${LOCAL_TTS_MEMORY_LIMIT:-1536m}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}

volumes:
  local-tts-models:
