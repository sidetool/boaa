name: Full checks

# Browser, Compose E2E and Windows native checks take a long time, so they run only on request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and verify browser artifact
        run: |
          pnpm web:build
          pnpm --filter @boaa/web check:artifact
        env:
          WEB_BASE_PATH: /boaa/
      - run: pnpm exec playwright-core install --with-deps chromium
      - name: Verify native asset CSP and reader selections
        run: node --test --test-concurrency=1 scripts/desktop/source-cover-csp.test.mjs scripts/desktop/user-font-csp.test.mjs scripts/desktop/reader-selection.test.mjs
      - run: pnpm check:web-pages:browser
        env:
          READER_UI_BROWSER_CHANNEL: chromium
      - name: Verify mobile selection tools and reader controls
        run: node scripts/reader-ui-smoke.mjs --selection-controls-only --mobile --no-screenshots
        env:
          READER_UI_BROWSER_CHANNEL: chromium
      - name: Verify paginated blind reading
        run: node scripts/performance/auto-scroll-smoke.mjs --paginated
        env:
          READER_UI_BROWSER_CHANNEL: chromium
      - run: pnpm check:reader-stability
        env:
          READER_UI_BROWSER_CHANNEL: chromium
      - name: Verify PDF worker lifecycle and persisted reading position
        run: node scripts/performance/pdf-session-smoke.mjs --dist apps/web/dist
      - name: Verify first TXT, EPUB and comic imports in fresh profiles
        run: node scripts/performance/import-first-use-smoke.mjs --dist apps/web/dist

  hosted-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static checks and shared typecheck (once)
        run: |
          pnpm format:check
          pnpm check:public-source
          pnpm check:licenses:source-release
          pnpm lint
          pnpm check:css
          pnpm check:contract-boundaries
          pnpm check:cycles
          pnpm check:bundle-inventory
          pnpm typecheck
      - name: Unit and integration tests (de-duplicated)
        run: |
          node --test scripts/ci/script-references.test.mjs
          node scripts/ci/quality-tests.mjs
          pnpm test:extension-runtime
          pnpm test:extension-sdk
          pnpm test:extension-cli
      - name: APK source cache tests
        run: node --test services/apk-worker/catalog.test.mjs services/apk-worker/source-cover-cache.test.mjs services/apk-worker/shared-task.test.mjs
      - name: Verify production server and web bundles
        run: |
          pnpm check:server:production
          pnpm check:hosted
          pnpm exec vite build
          pnpm diagnose:web-bundle
      - name: Install and test text-source companion
        working-directory: services/text-source-server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Install browser for synthetic Mangayomi App gate
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Verify synthetic Mangayomi install through comic reader
        run: pnpm check:extension-mangayomi-app
        env:
          READER_UI_BROWSER_CHANNEL: chromium

  hosted-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.local-tts.yaml config --quiet
      - name: Validate public and Suwayomi Compose profiles
        run: |
          docker compose -f compose.yaml -f compose.public.yaml config --quiet
          docker compose -f compose.yaml -f compose.public.yaml -f compose.suwayomi.yaml config --quiet
          docker compose -f compose.yaml -f compose.public.yaml -f compose.text-sources.yaml config --quiet
        env:
          READER_AUTH_TOKEN: ci-config-check-only
          POSTGRES_PASSWORD: ci-postgres-config-check-only
          MINIO_ROOT_USER: ci-storage-config-check-only
          MINIO_ROOT_PASSWORD: ci-storage-password-config-check-only
          SUWAYOMI_AUTH_USERNAME: ci-suwayomi-config-check-only
          SUWAYOMI_AUTH_PASSWORD: ci-suwayomi-password-config-check-only
          TEXT_SOURCE_SERVER_KEY: ci-text-source-config-check-only
      - name: Pull the fixed storage dependency
        run: docker compose pull minio
      - name: Protected Compose import E2E
        run: pnpm check:hosted:e2e -- --public --project-name boaa-ci-${{ github.run_id }}-${{ github.run_attempt }}

  windows-native-source:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:rust
      - run: pnpm check:native-source
      - run: pnpm check:mobile-readiness

  browser-server-management:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm check:server-management-ui
