name: Server release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version label (candidate mode does not require or create a Git tag)
        required: true
        type: string
      minio_dependency_only:
        description: Build the fixed storage dependency only (initial bootstrap)
        type: boolean
        default: false
      mode:
        description: Candidate validates this dispatch commit; release requires an existing reviewed version tag
        type: choice
        options: [candidate, release]
        default: candidate

permissions:
  contents: read

concurrency:
  group: server-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  minio-dependency:
    if: ${{ inputs.minio_dependency_only }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/minio-dependency.yml

  validate:
    if: ${{ !inputs.minio_dependency_only }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.mode == 'release' && inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate version, trust configuration and candidate boundary
        env:
          RELEASE_VERSION: ${{ inputs.tag }}
          RELEASE_CANDIDATE: ${{ inputs.mode == 'candidate' && 'true' || 'false' }}
          RELEASE_PRIVATE_KEY: ${{ secrets.BOAA_RELEASE_PRIVATE_KEY }}
        run: node scripts/release/preflight.mjs
      - run: pnpm check:web-server
      # The global desktop/mobile binary gate remains closed. This release has its own
      # fail-closed, final-image evidence verifier, executed for every native child below.
      - run: pnpm check:licenses:source-release
      - run: node --test scripts/release/*.test.mjs services/apk-worker/*.test.mjs services/runtime-components/runtime.test.mjs
      - run: python3 -m unittest discover -s services/runtime-components -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Prepare pinned corresponding-source archive
        run: python3 scripts/release/prepare-server-sources.py
      - name: Demonstrate WASM replacement build
        run: |
          set -euo pipefail
          scripts/release/rebuild-7z.sh > release/7z-rebuild.log 2>&1
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          Path('release/7z-rebuild.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'passed':True,'toolchain':'emscripten 4.0.10','test':'source rebuild and archive round trip'}))
          PY
      - name: Retain corresponding sources on the existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_VERSION" --clobber release/*
          # Source-only tags are deliberately outside releaseVersion(), so clients never install them.
          source_tag="server-sources-$(git rev-parse HEAD)"
          if ! gh release view "$source_tag" >/dev/null 2>&1; then
            gh release create "$source_tag" --target "$(git rev-parse HEAD)" --prerelease --latest=false \
              --title "Server source materials ($(git rev-parse --short HEAD))" \
              --notes 'Corresponding source materials for candidate container images. This is not an installable BOAA release.'
          fi
          gh release upload "$source_tag" --clobber release/boaa-server-sources.tar.gz release/boaa-server-sources.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: server-source-receipt
          path: |
            release/7z-rebuild.json
            release/7z-rebuild.log
            release/boaa-server-sources.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  build:
    needs: validate
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [server, web, apk, browser, metadata, updater]
        architecture: [amd64, arm64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.mode == 'release' && inputs.tag || github.sha }}
      - name: Build final native image locally
        env:
          COMPONENT: ${{ matrix.component }}
          ARCHITECTURE: ${{ matrix.architecture }}
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          recipe="deploy/$COMPONENT.Dockerfile"
          case "$COMPONENT" in apk|browser|metadata) recipe="deploy/runtime-$COMPONENT.Dockerfile" ;; esac
          docker buildx create --use
          docker buildx build --load --platform "linux/$ARCHITECTURE" -f "$recipe" \
            --build-arg "BOAA_COMPONENT_VERSION=${RELEASE_VERSION#v}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=${RELEASE_VERSION#v}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --provenance=false --sbom=false --tag "boaa-$COMPONENT:final" .
      - name: Capture final image and native execution evidence
        env:
          COMPONENT: ${{ matrix.component }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          sudo scripts/release/install-syft.sh
          python3 scripts/release/native-smoke.py --image "boaa-$COMPONENT:final" --component "$COMPONENT" --output evidence
          python3 scripts/release/image-evidence.py --image "boaa-$COMPONENT:final" --component "$COMPONENT" --output evidence
          python3 scripts/release/capture-debian-sources.py --image "boaa-$COMPONENT:final" --component "$COMPONENT" --output evidence
          python3 scripts/release/verify-server-evidence.py --prefix "$COMPONENT-$ARCHITECTURE" --directory evidence
      - name: Publish image sources before registry upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ matrix.component }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          source_tag="server-sources-$(git rev-parse HEAD)"
          test "$(gh release view "$source_tag" --json isDraft --jq .isDraft)" = false
          gh release upload "$source_tag" --clobber \
            "evidence/$COMPONENT-$ARCHITECTURE-debian-sources.tar.gz" \
            "evidence/$COMPONENT-$ARCHITECTURE-debian-sources.json" \
            "evidence/$COMPONENT-$ARCHITECTURE-embedded-sources.tar.gz" \
            "evidence/$COMPONENT-$ARCHITECTURE-notices.tar.gz"
      - name: Store verified candidate image in registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ matrix.component }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          # Packages can already be public after the first release. Sources are public first.
          candidate="ghcr.io/$owner/boaa-$COMPONENT:candidate-$(git rev-parse --short=12 HEAD)-$ARCHITECTURE"
          docker tag "boaa-$COMPONENT:final" "$candidate"
          docker push "$candidate" 2>&1 | tee /tmp/image-push.log
          digest=$(sed -n 's/.*digest: \(sha256:[a-f0-9]*\).*/\1/p' /tmp/image-push.log | tail -1)
          test -n "$digest"
          IMAGE_DIGEST="$digest" IMAGE_ID="$(docker image inspect --format '{{.Id}}' "boaa-$COMPONENT:final")" python3 - <<'PY'
          import json,os
          from pathlib import Path
          prefix=os.environ['COMPONENT']+'-'+os.environ['ARCHITECTURE']
          Path('evidence/'+prefix+'.json').write_text(json.dumps({'containerimage.digest':os.environ['IMAGE_DIGEST'],'containerimage.config.digest':os.environ['IMAGE_ID']}))
          PY
      - name: Retain final-image evidence and sources on the existing draft
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! -d evidence ]] || ! find evidence -type f -print -quit | read -r _; then exit 0; fi
          test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_VERSION" --clobber evidence/*
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: image-${{ matrix.component }}-${{ matrix.architecture }}
          path: evidence/${{ matrix.component }}-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 30

  integration:
    needs: build
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.mode == 'release' && inputs.tag || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*-${{ matrix.architecture }}
          merge-multiple: true
          path: evidence
      - name: Execute update, backup and rollback inside final updater image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for component in server web apk browser metadata updater; do
            digest=$(jq -r '."containerimage.digest"' "evidence/$component-$ARCHITECTURE.json")
            docker pull "ghcr.io/$owner/boaa-$component@$digest"
            docker tag "ghcr.io/$owner/boaa-$component@$digest" "boaa-$component:final"
          done
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          docker run --name boaa-release-integration \
            -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/tmp \
            -e BOAA_SMOKE_SERVER_IMAGE=boaa-server:final -e BOAA_SMOKE_WEB_IMAGE=boaa-web:final \
            -e BOAA_SMOKE_APK_IMAGE=boaa-apk:final -e BOAA_SMOKE_BROWSER_IMAGE=boaa-browser:final \
            -e BOAA_SMOKE_METADATA_IMAGE=boaa-metadata:final \
            --entrypoint node boaa-updater:final scripts/release/docker-smoke.mjs | tee evidence/integration.log
          docker rm boaa-release-integration
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          Path('evidence/integration-'+os.environ['ARCHITECTURE']+'.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'architecture':os.environ['ARCHITECTURE'],'passed':True}))
          PY
          mv evidence/integration.log "evidence/integration-$ARCHITECTURE.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-${{ matrix.architecture }}
          path: evidence/integration-*
          retention-days: 30

  draft:
    needs: integration
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.mode == 'release' && inputs.tag || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release
      - name: Assemble digest-bound, signed draft assets (never publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.tag }}
          RELEASE_PRIVATE_KEY: ${{ secrets.BOAA_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gh release download "$RELEASE_VERSION" --dir release --clobber
          mkdir image-metadata
          cp release/{server,web,updater,apk,browser,metadata}-{amd64,arm64}.json image-metadata/
          export BOAA_IMAGE_TAG="candidate-$(git rev-parse HEAD)"
          node scripts/release/collect-images.mjs
          node scripts/release/bundle.mjs
          node scripts/release/sign.mjs release/images.json
          node scripts/release/verify-bundle.mjs release/boaa-install.tar.gz release/boaa-install.tar.gz.sig deploy/release-public.pub
          python3 scripts/release/verify-server-evidence.py --directory release --assemble
          node scripts/release/sign-evidence.mjs
          node scripts/release/verify-evidence.mjs release
          # Existing operator draft only: no tag creation, undrafting or public package changes.
          test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_VERSION" --clobber \
            release/images.json release/children.json release/release.json release/release.json.sig \
            release/boaa-install.tar.gz release/boaa-install.tar.gz.sig \
            release/integration-{amd64,arm64}.{json,log} \
            release/server-evidence.json release/server-evidence.json.sig
          # Every signed companion must survive independently of Actions retention.
          gh release view "$RELEASE_VERSION" --json assets > /tmp/draft-assets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path('release/server-evidence.json').read_text())
          uploaded={row['name'] for row in json.loads(Path('/tmp/draft-assets.json').read_text())['assets']}
          missing=set(evidence['artifacts'])|{'server-evidence.json','server-evidence.json.sig'}
          missing-=uploaded
          if missing: raise SystemExit('draft_companion_assets_missing: '+', '.join(sorted(missing)))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signed-server-release
          path: |
            release/server-evidence.json
            release/server-evidence.json.sig
            release/release.json
            release/release.json.sig
            release/images.json
            release/children.json
            release/boaa-install.tar.gz
            release/boaa-install.tar.gz.sig
          retention-days: 30
