name: Promote reviewed server image tags
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing final Git tag created by the reviewing parent/operator
        required: true
        type: string
permissions:
  # Draft release assets require repository write access even for read operations.
  contents: write
  packages: write
concurrency:
  group: server-promotion-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Promote approved digests without changing package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_VERSION" --dir release \
            --pattern server-evidence.json --pattern server-evidence.json.sig --pattern images.json
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          node scripts/release/promote-images.mjs
