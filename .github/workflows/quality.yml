name: Quality

# Fast checks on every push and pull request. Run "Full checks" by hand for browser, Compose E2E and Windows checks.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: |
          pnpm format:check
          pnpm check:public-source
          pnpm lint
          pnpm check:css
          pnpm typecheck
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - name: Build server and web
        run: |
          pnpm --filter server bundle
          pnpm exec vite build
      - name: Validate Compose files
        run: |
          docker compose -f compose.release.yaml config --quiet
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.public.yaml config --quiet
        env:
          READER_AUTH_TOKEN: ci-config-check-only
          POSTGRES_PASSWORD: ci-postgres-config-check-only
          MINIO_ROOT_USER: ci-storage-config-check-only
          MINIO_ROOT_PASSWORD: ci-storage-password-config-check-only

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit and integration tests
        run: |
          node scripts/ci/quality-tests.mjs
          node --test scripts/release/*.test.mjs services/apk-worker/*.test.mjs services/runtime-components/runtime.test.mjs
          python3 -m unittest discover -s services/runtime-components -p 'test_*.py'
