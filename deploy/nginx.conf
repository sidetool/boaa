map $http_x_forwarded_proto $boaa_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 32m;

  # Optional runtime changes recreate API without changing this web image. Resolve Docker DNS
  # on requests so a new API address also works after component changes and rollback.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  set $boaa_api_upstream api:8787;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  root /usr/share/nginx/html;
  index index.html;

  # Fixed JS plugin runtime files. Preserve the API's per-resource CSP.
  location ^~ /plugin-runtime/ {
    proxy_pass http://$boaa_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $boaa_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # 32 MiB APK plus the bounded JSON/base64 envelope; other API limits stay unchanged.
  location ~ ^/api/(apk|mangayomi)-extensions/inspect-file$ {
    client_max_body_size 45m;
    proxy_request_buffering off;
    proxy_pass http://$boaa_api_upstream;
    proxy_http_version 1.1;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $boaa_forwarded_proto;
  }

  # Long chapter catalogs; ordinary API requests retain their limits.
  location ~ ^/api/extensions/sources/[^/]+/list$ {
    proxy_request_buffering off;
    proxy_pass http://$boaa_api_upstream;
    proxy_http_version 1.1;
    proxy_read_timeout 720s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $boaa_forwarded_proto;
  }

  # Source downloads return a receipt only after acquiring the chapter. Allow
  # the client's ten-minute operation budget through this inner proxy as well.
  location ~ ^/api/extensions/sources/[^/]+/(download|prepared-(images|documents)(/assemble)?)$ {
    proxy_request_buffering off;
    proxy_pass http://$boaa_api_upstream;
    proxy_http_version 1.1;
    proxy_read_timeout 720s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $boaa_forwarded_proto;
  }

  location /api/ {
    proxy_request_buffering off;
    proxy_pass http://$boaa_api_upstream;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $boaa_forwarded_proto;
  }

  # Original PDF/comic sources can be much larger than chunked text imports.
  # Stream both large PUT bodies and Range responses without nginx temp files.
  location ~ ^/api/(books/[^/]+/source|original-downloads/[^/]+)$ {
    client_max_body_size 512m;
    client_body_timeout 900s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass_header X-Accel-Buffering;
    proxy_pass http://$boaa_api_upstream;
    proxy_http_version 1.1;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $boaa_forwarded_proto;
  }

  # Backup upload is streamed to disk, with compressed/expanded limits enforced by the API.
  location /api/backups/ {
    client_max_body_size 257g;
    client_body_timeout 900s;
    proxy_pass_header X-Accel-Buffering;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://$boaa_api_upstream;
    proxy_http_version 1.1;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $boaa_forwarded_proto;
  }

  location /health {
    proxy_pass http://$boaa_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /ready {
    proxy_pass http://$boaa_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Chrome checks this file on every deployed update. Never pin an old worker at the proxy layer.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Generated from the container's allow-listed public environment on every start.
  location = /runtime-config.js {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
